<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hub Growth Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0e14;
            color: #bb86fc;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(138, 43, 226, 0.3);
            padding: 30px;
            border-radius: 20px;
        }
        h1 { text-align: center; margin-bottom: 4px; }
        h1 + p { text-align: center; margin-bottom: 20px; color: #888; }
        input, textarea, select {
            width: 100%; margin-bottom: 10px; padding: 10px;
            border-radius: 5px; border: 1px solid #8a2be2;
            background: #1a1d23; color: white;
            font-family: inherit;
        }
        textarea { resize: vertical; min-height: 70px; }
        button.main-btn {
            width: 100%; padding: 12px; background: #8a2be2;
            color: white; border: none; border-radius: 5px;
            cursor: pointer; font-weight: bold;
            transition: background 0.2s;
        }
        button.main-btn:hover { background: #7a1bd2; }
        .filters { display: flex; gap: 10px; margin: 15px 0; }
        .filters select { margin-bottom: 0; }
        .milestone-card {
            background: rgba(255, 255, 255, 0.03);
            border-left: 4px solid #03dac6;
            margin: 15px 0; padding: 15px;
            border-radius: 0 10px 10px 0;
            position: relative;
        }
        .category {
            color: #03dac6; font-weight: bold;
            font-size: 0.7rem; text-transform: uppercase;
        }
        .card-actions {
            position: absolute; top: 10px; right: 10px;
            display: flex; gap: 8px;
        }
        .delete-btn, .edit-btn {
            background: none; border: none;
            cursor: pointer; font-weight: bold;
            font-size: 0.8rem; opacity: 0.6;
            transition: opacity 0.2s;
        }
        .delete-btn { color: #ff4d4d; }
        .edit-btn   { color: #03dac6; }
        .delete-btn:hover, .edit-btn:hover { opacity: 1; }
        .chart-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(138,43,226,0.2);
            border-radius: 12px;
            padding: 16px; margin: 15px 0;
        }
        .chart-box h3 {
            font-size: 0.85rem; color: #888;
            margin-bottom: 12px; text-align: center;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(138,43,226,0.2);
        }
        .social-links a {
            color: #bb86fc;
            font-size: 1.8rem;
            text-decoration: none;
            transition: transform 0.2s, color 0.2s;
        }
        .social-links a:hover { transform: scale(1.2); }
        .social-links a.instagram:hover { color: #e1306c; }
        .social-links a.github:hover    { color: #ffffff; }
        .social-links a.twitter:hover   { color: #1da1f2; }
        .social-links a.linkedin:hover  { color: #0077b5; }
        .modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #12151c;
            border: 1px solid rgba(138, 43, 226, 0.5);
            border-radius: 16px; padding: 30px;
            width: 90%; max-width: 460px;
            animation: popIn 0.2s ease;
        }
        @keyframes popIn {
            from { transform: scale(0.92); opacity: 0; }
            to   { transform: scale(1);    opacity: 1; }
        }
        .modal h2 { color: #d8b4fe; margin-bottom: 18px; font-size: 1.1rem; }
        .modal-actions { display: flex; gap: 10px; margin-top: 4px; }
        .modal-actions button {
            flex: 1; padding: 11px;
            border: none; border-radius: 6px;
            font-weight: bold; cursor: pointer;
            font-family: inherit; transition: opacity 0.2s;
        }
        .btn-save   { background: #8a2be2; color: white; }
        .btn-cancel { background: #2a2d35; color: #aaa; }
        .btn-save:hover, .btn-cancel:hover { opacity: 0.85; }
        #toast {
            position: fixed; bottom: 24px; left: 50%;
            transform: translateX(-50%);
            background: #03dac6; color: #0b0e14;
            padding: 10px 22px; border-radius: 30px;
            font-weight: bold; font-size: 0.85rem;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s; z-index: 200;
        }
        #toast.show { opacity: 1; }
    </style>
</head>
<body>
    {% csrf_token %}
    <div class="container">
        <h1>Welcome, Anita!</h1>
        <div style="text-align:center; margin-bottom: 10px;">
            <a href="/logout/" style="color:#ff4d4d; font-size:0.85rem; text-decoration:none; font-weight:bold;">🚪 Logout</a>
        </div>
        <p>Swahilipot Growth Tracker</p>

        <div id="form-area">
            <input type="text" id="new-title" placeholder="Milestone Title">
            <input type="text" id="new-category" placeholder="Category (e.g. Django, Frontend)">
            <textarea id="new-desc" placeholder="Brief description..."></textarea>
            <button class="main-btn" onclick="addMilestone()">+ Add New Milestone</button>
        </div>

        <!-- Progress Chart -->
        <div class="chart-box">
            <h3>📊 Milestones per Category</h3>
            <canvas id="progressChart" height="180"></canvas>
        </div>

        <!-- Filters -->
        <div class="filters">
            <select id="month-filter" onchange="loadMilestones()">
                <option value="">📅 All Months</option>
                <option value="01">January</option>
                <option value="02">February</option>
                <option value="03">March</option>
                <option value="04">April</option>
                <option value="05">May</option>
                <option value="06">June</option>
                <option value="07">July</option>
                <option value="08">August</option>
                <option value="09">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
            </select>
            <select id="category-filter" onchange="loadMilestones()">
                <option value="">🏷️ All Categories</option>
            </select>
        </div>

        <div id="milestone-list">
            <p style="text-align:center; margin-top:20px; color:#555;">Scanning the database...</p>
        </div>

        <!-- Social Media Links -->
        <div class="social-links">
            <a href="https://instagram.com/being_anita1" target="_blank" class="instagram" title="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://github.com/anita564-lucy" target="_blank" class="github" title="GitHub">
                <i class="fab fa-github"></i>
            </a>
            <a href="https://twitter.com/LucyAnita194615" target="_blank" class="twitter" title="Twitter/X">
                <i class="fab fa-x-twitter"></i>
            </a>
            <a href="https://www.linkedin.com/in/lucy-odhiambo-65a123277" target="_blank" class="linkedin" title="LinkedIn">
                <i class="fab fa-linkedin"></i>
            </a>
        </div>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h2>✏️ Edit Milestone</h2>
            <input type="hidden" id="edit-id">
            <input type="text" id="edit-title" placeholder="Title">
            <input type="text" id="edit-category" placeholder="Category">
            <textarea id="edit-desc" placeholder="Description..."></textarea>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-save" onclick="saveEdit()">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        let allMilestones = [];
        let chartInstance = null;

        function getCsrf() {
            return document.querySelector('[name=csrfmiddlewaretoken]').value;
        }
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }
        function renderChart(data) {
            const counts = {};
            data.forEach(m => {
                const cat = m.category || 'General';
                counts[cat] = (counts[cat] || 0) + 1;
            });
            const labels = Object.keys(counts);
            const values = Object.values(counts);
            if (chartInstance) chartInstance.destroy();
            const ctx = document.getElementById('progressChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        label: 'Milestones',
                        data: values,
                        backgroundColor: 'rgba(138, 43, 226, 0.6)',
                        borderColor: '#8a2be2',
                        borderWidth: 2,
                        borderRadius: 6,
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#bb86fc' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        y: { ticks: { color: '#bb86fc', stepSize: 1 }, grid: { color: 'rgba(255,255,255,0.05)' } }
                    }
                }
            });
        }
        async function loadMilestones() {
            const month    = document.getElementById('month-filter').value;
            const category = document.getElementById('category-filter').value;
            const res = await fetch('/api/milestones/');
            allMilestones = await res.json();
            const categories = [...new Set(allMilestones.map(m => m.category).filter(Boolean))];
            const catSelect = document.getElementById('category-filter');
            const currentCat = catSelect.value;
            catSelect.innerHTML = '<option value="">🏷️ All Categories</option>';
            categories.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c; opt.textContent = c;
                if (c === currentCat) opt.selected = true;
                catSelect.appendChild(opt);
            });
            let data = allMilestones;
            renderChart(allMilestones);
            if (month) {
                data = data.filter(m => {
                    const d = new Date(m.date_created);
                    const mm = String(d.getMonth() + 1).padStart(2, '0');
                    return mm === month;
                });
            }
            if (category) {
                data = data.filter(m => m.category === category);
            }
            const list = document.getElementById('milestone-list');
            if (data.length === 0) {
                list.innerHTML = '<p style="text-align:center;margin-top:20px;color:#555;">No milestones found!</p>';
                return;
            }
            list.innerHTML = data.map(m => `
                <div class="milestone-card" id="card-${m.id}">
                    <div class="category">${m.category || 'General'}</div>
                    <h3 style="margin:5px 0 4px;color:#d8b4fe;">${m.title}</h3>
                    <p style="color:#e2e8f0;font-size:0.9em;">${m.description}</p>
                    <small style="color:#555;">${new Date(m.date_created).toLocaleDateString()}</small>
                    <div class="card-actions">
                        <button class="edit-btn" onclick="openEditModal(${m.id}, '${escQ(m.title)}', '${escQ(m.category)}', '${escQ(m.description)}')">[✎] Edit</button>
                        <button class="delete-btn" onclick="deleteMilestone(${m.id})">[✕] Delete</button>
                    </div>
                </div>
            `).join('');
        }
        function escQ(str) {
            return (str || '').replace(/'/g, "\\'").replace(/\n/g, ' ');
        }
        async function addMilestone() {
            const title       = document.getElementById('new-title').value.trim();
            const category    = document.getElementById('new-category').value.trim();
            const description = document.getElementById('new-desc').value.trim();
            if (!title) { alert('Please add a title!'); return; }
            await fetch('/api/milestones/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrf() },
                body: JSON.stringify({ title, category, description })
            });
            document.getElementById('new-title').value    = '';
            document.getElementById('new-category').value = '';
            document.getElementById('new-desc').value     = '';
            showToast('✅ Milestone added!');
            loadMilestones();
        }
        async function deleteMilestone(id) {
            if (!confirm('Delete this milestone?')) return;
            await fetch(`/api/milestones/delete/${id}/`, {
                method: 'POST',
                headers: { 'X-CSRFToken': getCsrf() }
            });
            showToast('🗑️ Milestone deleted.');
            loadMilestones();
        }
        function openEditModal(id, title, category, description) {
            document.getElementById('edit-id').value       = id;
            document.getElementById('edit-title').value    = title;
            document.getElementById('edit-category').value = category;
            document.getElementById('edit-desc').value     = description;
            document.getElementById('editModal').classList.add('active');
        }
        function closeModal() {
            document.getElementById('editModal').classList.remove('active');
        }
        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        async function saveEdit() {
            const id          = document.getElementById('edit-id').value;
            const title       = document.getElementById('edit-title').value.trim();
            const category    = document.getElementById('edit-category').value.trim();
            const description = document.getElementById('edit-desc').value.trim();
            if (!title) { alert('Title cannot be empty!'); return; }
            const res = await fetch(`/api/milestones/update/${id}/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrf() },
                body: JSON.stringify({ title, category, description })
            });
            const data = await res.json();
            if (data.status === 'success') {
                closeModal();
                showToast('✏️ Milestone updated!');
                loadMilestones();
            } else {
                alert('Something went wrong: ' + data.message);
            }
        }
        loadMilestones();
    </script>
</body>
</html>
