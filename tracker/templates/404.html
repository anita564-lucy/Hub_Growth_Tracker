<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <title>Page Not Found</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0e14;
            color: #bb86fc;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-family: 'Pinyon Script', cursive;
            font-size: 6rem;
            color: #8a2be2;
            margin-bottom: 10px;
        }
        h2 {
            font-size: 1.2rem;
            font-weight: 400;
            color: #888;
            margin-bottom: 30px;
        }
        a {
            background: #8a2be2;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }
        a:hover { background: #7a1bd2; }
    </style>
</head>
<body>
    <h1>404</h1>
    <h2>Oops! The page you are looking for does not exist.</h2>
    <a href="/">Go Back Home</a>
</body>
</html>
