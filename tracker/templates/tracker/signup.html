{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Hub Growth Tracker</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        /* Ensuring the clean, dark aesthetic matches your dashboard */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: #1e1e1e;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid #333;
        }
        h2 {
            text-align: center;
            color: #8a2be2; /* Your signature purple */
            margin-bottom: 1.5rem;
        }
        .btn-purple {
            background-color: #8a2be2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .btn-purple:hover {
            background-color: #7a1fcf;
        }
        p {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #bbb;
        }
        a {
            color: #8a2be2;
            text-decoration: none;
        }
        /* Styling the Django auto-generated form fields */
        form p {
            text-align: left;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #2d2d2d;
            color: white;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Create Account</h2>
    
    <form method="POST">
        {% csrf_token %}
        
        {{ form.as_p }}
        
        <button type="submit" class="btn-purple">Sign Up</button>
    </form>

    <p>Already have an account? <a href="{% url 'login' %}">Login here</a></p>
</div>

</body>
</html>
