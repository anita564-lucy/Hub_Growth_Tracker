<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hub Growth Tracker</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #bb86fc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(138, 43, 226, 0.3);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.2);
        }
        h1 { text-align: center; text-shadow: 0 0 10px #8a2be2; }
        .milestone-card {
            background: rgba(255, 255, 255, 0.03);
            border-left: 4px solid #03dac6;
            margin: 15px 0;
            padding: 15px;
            border-radius: 0 10px 10px 0;
            transition: 0.3s;
            position: relative; /* Needed for the delete button positioning */
        }
        .milestone-card:hover {
            transform: translateX(10px);
            background: rgba(138, 43, 226, 0.1);
        }
        .category {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #03dac6;
            font-weight: bold;
        }
        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #ff4d4d;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            opacity: 0.6;
        }
        .delete-btn:hover { opacity: 1; }
    </style>
</head>
<body>

    {% csrf_token %}
    <div class="container">
        <h1>Welcome, Anita!</h1>
        <p style="text-align: center; color: #ddd;">Swahilipot Growth Tracker</p>
        <hr style="border: 0.5px solid rgba(255,255,255,0.1);">
        
        <div style="margin-bottom: 20px;">
            <input type="text" id="new-title" placeholder="Milestone Title" style="width: 100%; margin-bottom: 10px; padding: 10px; border-radius: 5px; border: 1px solid #8a2be2; background: #1a1d23; color: white;">
            <input type="text" id="new-category" placeholder="Category" style="width: 100%; margin-bottom: 10px; padding: 10px; border-radius: 5px; border: 1px solid #8a2be2; background: #1a1d23; color: white;">
            <textarea id="new-desc" placeholder="Brief description..." style="width: 100%; margin-bottom: 10px; padding: 10px; border-radius: 5px; border: 1px solid #8a2be2; background: #1a1d23; color: white;"></textarea>
            
            <button onclick="addMilestone()" style="width: 100%; padding: 12px; background: #8a2be2; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
                + Add New Milestone
            </button>
        </div>

        <div id="milestone-list">
            <p style="text-align: center;">Scanning the database...</p>
        </div>
   </div>

    <script>
        async function loadMilestones() {
            try {
                const response = await fetch('/api/milestones/');
                const data = await response.json();
                const list = document.getElementById('milestone-list');
                list.innerHTML = ''; 

                data.forEach(m => {
                    list.innerHTML += `
                        <div class="milestone-card">
                            <div class="category">${m.category}</div>
                            <h3 style="margin: 5px 0; color: #d8b4fe;">${m.title}</h3>
                            <p style="margin: 0; color: #e2e8f0; font-size: 0.9em;">${m.description}</p>
                            <button class="delete-btn" onclick="deleteMilestone(${m.id})">[X] Delete</button>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Error:", error);
            }
        }

        async function addMilestone() {
            const title = document.getElementById('new-title').value;
            const category = document.getElementById('new-category').value;
            const description = document.getElementById('new-desc').value;
            const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;

            if (!title) return alert("Please add a title!");

            const response = await fetch('/api/milestones/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken,
                },
                body: JSON.stringify({ title, category, description })
            });

            if (response.ok) {
                document.getElementById('new-title').value = '';
                document.getElementById('new-category').value = '';
                document.getElementById('new-desc').value = '';
                loadMilestones(); 
            }
        }

        async function deleteMilestone(id) {
            if (!confirm("Are you sure you want to delete this achievement?")) return;
            const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;

            const response = await fetch(`/api/milestones/delete/${id}/`, {
                method: 'POST',
                headers: { 'X-CSRFToken': csrftoken }
            });

            if (response.ok) {
                loadMilestones(); 
            }
        }

        loadMilestones();
    </script>
</body>
</html>
